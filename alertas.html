<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVision - Alertas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" aria-label="Navegação principal">
            <div class="sidebar-brand">
                <span class="brand-mark">WV</span>
                <div class="sidebar-brand-text">
                    <span class="sidebar-brand-label">WEBVISION</span>
                    <span class="sidebar-brand-title">Monitoramento</span>
                </div>
            </div>

            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="index.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9632;</span>
                        Dashboard
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="dispositivos.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9654;</span>
                        Dispositivos
                    </a>
                </li>
                <li class="sidebar-nav-item active">
                    <a href="alertas.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9888;</span>
                        Alertas
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="relatorios.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9776;</span>
                        Relatórios
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="configuracoes.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9881;</span>
                        Configurações
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="user-iniciais"></div>
                    <div class="sidebar-user-info">
                        <span class="sidebar-user-name" id="user-nome"></span>
                        <span class="sidebar-user-role" id="user-papel"></span>
                    </div>
                </div>
                <a href="login.html" class="sidebar-logout">Sair</a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="topbar-title">Alertas</h1>
                    <span class="topbar-subtitle">Central de notificações e eventos</span>
                </div>
                <div class="topbar-right">
                    <span class="status-badge status-badge--warning">
                        <span class="status-badge-dot status-badge-dot--warning"></span>
                        <span id="badge-alertas-ativos"></span>
                    </span>
                </div>
            </header>

            <main class="main-content">
                <!-- Alert Summary Cards -->
                <section class="kpi-grid kpi-grid--3" aria-label="Resumo de alertas">
                    <div class="kpi-card kpi-card--border-red">
                        <div class="kpi-icon kpi-icon--red">!</div>
                        <div class="kpi-body">
                            <span class="kpi-label">Críticos</span>
                            <strong class="kpi-value" id="contador-critico"></strong>
                        </div>
                    </div>
                    <div class="kpi-card kpi-card--border-yellow">
                        <div class="kpi-icon kpi-icon--yellow">&#9888;</div>
                        <div class="kpi-body">
                            <span class="kpi-label">Avisos</span>
                            <strong class="kpi-value" id="contador-warning"></strong>
                        </div>
                    </div>
                    <div class="kpi-card kpi-card--border-blue">
                        <div class="kpi-icon kpi-icon--blue">i</div>
                        <div class="kpi-body">
                            <span class="kpi-label">Informativos</span>
                            <strong class="kpi-value" id="contador-info"></strong>
                        </div>
                    </div>
                </section>

                <!-- Filters -->
                <section class="filters-bar" aria-label="Filtros de alertas">
                    <div class="filter-group">
                        <input type="text" class="form-input form-input--search" placeholder="Buscar alerta...">
                    </div>
                    <div class="filter-group">
                        <select class="form-select">
                            <option>Todas as severidades</option>
                            <option>Crítico</option>
                            <option>Aviso</option>
                            <option>Informativo</option>
                        </select>
                        <select id="filtro-dispositivo" class="form-select">
                            <option>Todos os dispositivos</option>
                            <!-- preenchido via JS -->
                        </select>
                    </div>
                </section>

                <!-- Alert List -->
                <section class="panel" aria-label="Lista de alertas">
                    <div class="panel-body">
                        <div class="alert-list" id="alert-list">
                            <!-- preenchido via JS -->
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const ICONE_SEVERIDADE = {
            critical: '!',
            warning: '&#9888;',
            info: 'i'
        };

        async function carregarDados() {
            const res = await fetch('db.json');
            const db = await res.json();

            // Usuário
            document.getElementById('user-iniciais').textContent = db.usuario.iniciais;
            document.getElementById('user-nome').textContent = db.usuario.nome;
            document.getElementById('user-papel').textContent = db.usuario.papel;

            // Contadores
            const ativos = db.alertas.filter(a => a.ativo).length;
            document.getElementById('badge-alertas-ativos').textContent =
                `${ativos} alerta${ativos !== 1 ? 's' : ''} ativo${ativos !== 1 ? 's' : ''}`;

            document.getElementById('contador-critico').textContent =
                db.alertas.filter(a => a.severidade === 'critical').length;
            document.getElementById('contador-warning').textContent =
                db.alertas.filter(a => a.severidade === 'warning').length;
            document.getElementById('contador-info').textContent =
                db.alertas.filter(a => a.severidade === 'info').length;

            // Filtro de dispositivos
            const filtroDisp = document.getElementById('filtro-dispositivo');
            const dispositivos = [...new Set(db.alertas.map(a => a.dispositivo))];
            dispositivos.forEach(nome => {
                const opt = document.createElement('option');
                opt.textContent = nome;
                filtroDisp.appendChild(opt);
            });

            // Lista de alertas
            const alertList = document.getElementById('alert-list');
            db.alertas.forEach(a => {
                alertList.innerHTML += `
                <article class="alert-item alert-item--${a.severidade}">
                    <div class="alert-item-icon">${ICONE_SEVERIDADE[a.severidade]}</div>
                    <div class="alert-item-body">
                        <div class="alert-item-header">
                            <h3 class="alert-item-title">${a.titulo}</h3>
                            <time class="alert-item-time">${a.horario}</time>
                        </div>
                        <p class="alert-item-desc">${a.descricao}</p>
                        <div class="alert-item-meta">
                            <span class="alert-item-device">${a.dispositivo}</span>
                            <span class="severity severity--${a.severidade}">${a.severidade_label}</span>
                        </div>
                    </div>
                </article>`;
            });
        }

        carregarDados();
    </script>
</body>

</html>
