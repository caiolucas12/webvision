<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVision - Dispositivos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" aria-label="Navegação principal">
            <div class="sidebar-brand">
                <span class="brand-mark">WV</span>
                <div class="sidebar-brand-text">
                    <span class="sidebar-brand-label">WEBVISION</span>
                    <span class="sidebar-brand-title">Monitoramento</span>
                </div>
            </div>

            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="index.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9632;</span>
                        Dashboard
                    </a>
                </li>
                <li class="sidebar-nav-item active">
                    <a href="dispositivos.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9654;</span>
                        Dispositivos
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="alertas.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9888;</span>
                        Alertas
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="relatorios.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9776;</span>
                        Relatórios
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="configuracoes.html" class="sidebar-nav-link">
                        <span class="nav-icon">&#9881;</span>
                        Configurações
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="user-iniciais"></div>
                    <div class="sidebar-user-info">
                        <span class="sidebar-user-name" id="user-nome"></span>
                        <span class="sidebar-user-role" id="user-papel"></span>
                    </div>
                </div>
                <a href="login.html" class="sidebar-logout">Sair</a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="topbar-title">Dispositivos</h1>
                    <span class="topbar-subtitle">Gerenciamento de equipamentos da rede</span>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary">+ Adicionar Dispositivo</button>
                </div>
            </header>

            <main class="main-content">
                <!-- Filters -->
                <section class="filters-bar" aria-label="Filtros">
                    <div class="filter-group">
                        <input type="text" class="form-input form-input--search" placeholder="Buscar dispositivo...">
                    </div>
                    <div class="filter-group">
                        <select class="form-select">
                            <option>Todos os tipos</option>
                            <option>Servidores</option>
                            <option>Desktops</option>
                            <option>Notebooks</option>
                        </select>
                        <select class="form-select">
                            <option>Todos os status</option>
                            <option>Online</option>
                            <option>Offline</option>
                            <option>Manutenção</option>
                        </select>
                    </div>
                </section>

                <!-- Device Table -->
                <section class="panel" aria-label="Lista de dispositivos">
                    <div class="panel-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Dispositivo</th>
                                    <th>Endereço IP</th>
                                    <th>Tipo</th>
                                    <th>Sistema</th>
                                    <th>CPU</th>
                                    <th>RAM</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-dispositivos">
                                <!-- preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        async function carregarDados() {
            const res = await fetch('db.json');
            const db = await res.json();

            // Usuário
            document.getElementById('user-iniciais').textContent = db.usuario.iniciais;
            document.getElementById('user-nome').textContent = db.usuario.nome;
            document.getElementById('user-papel').textContent = db.usuario.papel;

            // Tabela de dispositivos
            const tbody = document.getElementById('tabela-dispositivos');
            db.dispositivos.forEach(d => {
                const isOffline = d.status === 'offline';
                const iconeClass = ['device-icon', d.tipo_icone !== 'servidor' ? d.tipo_icone : '']
                    .filter(Boolean).join(' ');

                const cpuCell = isOffline
                    ? `<span class="small text-secondary">—</span>`
                    : `<div class="inline-meter"><span style="width: ${Math.round(d.cpu)}%;"></span></div>
                       <span class="small">${d.cpu}%</span>`;

                const ramCell = isOffline
                    ? `<span class="small text-secondary">—</span>`
                    : `<div class="inline-meter inline-meter--green"><span style="width: ${Math.round(d.ram)}%;"></span></div>
                       <span class="small">${d.ram}%</span>`;

                const statusLabel = d.status === 'online' ? 'Online' : 'Offline';
                const statusClass = d.status === 'online'
                    ? 'status-pill status-pill--online'
                    : 'status-pill status-pill--offline';

                tbody.innerHTML += `
                <tr${isOffline ? ' class="row-offline"' : ''}>
                    <td class="td-device">
                        <span class="${iconeClass}">${d.icone}</span>
                        <strong>${d.nome}</strong>
                    </td>
                    <td class="font-monospace">${d.ip}</td>
                    <td>${d.tipo}</td>
                    <td>${d.sistema}</td>
                    <td>${cpuCell}</td>
                    <td>${ramCell}</td>
                    <td><span class="${statusClass}">${statusLabel}</span></td>
                </tr>`;
            });
        }

        carregarDados();
    </script>
</body>

</html>
