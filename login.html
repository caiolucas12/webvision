<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVision - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="brand-mark brand-mark--large">WV</span>
                <h1 class="login-title">WebVision</h1>
                <p class="login-subtitle">Sistema de Monitoramento de Rede</p>
            </div>

            <form class="login-form" action="index.html" method="get">
                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-input" placeholder="admin@webvision.local" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" class="form-input" placeholder="********" required>
                </div>

                <div class="form-row">
                    <label class="form-checkbox">
                        <input type="checkbox">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="form-link">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <div class="login-footer">
                <p>Modo demonstração — use qualquer credencial</p>
            </div>
        </div>

        <div class="login-bg-decor" aria-hidden="true"></div>
    </div>
</body>

</html>
